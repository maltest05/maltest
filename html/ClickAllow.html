<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click "Allow"</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="click-overlay" onclick="triggerNotificationPrompt()"></div>

  <div class="page-container">

    <div class="left-content">
      <h1 class="main-text">
        Click allow if<br>
        you are not a<br>
        robot
      </h1>

      <div class="logo-container">
        <div class="captcha-icon">C</div>
        <div class="logo-text">E-CAPTCHA</div>
      </div>
    </div>

    <div class="right-content">
      <div class="robot">
        <div class="question-marks">??</div>

        <div class="head">
          <div class="screen">
            <div class="eyes">
              <div class="eye left-eye"></div>
              <div class="eye right-eye"></div>
            </div>
            <div class="mouth"></div>
          </div>
        </div>

        <div class="left-arm"></div>

        <div class="body">
          <div class="chest-light"></div>
        </div>

        <div class="right-arm"></div>

        <div class="belt">
          <div class="buckle"></div>
        </div>

        <div class="lower-body"></div>
      </div>

      <div class="shadow"></div>
    </div>

  </div>

<script src="html/js/click-allow.js"></script>
</body>
</html>
